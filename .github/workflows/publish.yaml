name: Publish

on:
  push:
    branches:
      - 'version/*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    name: "Publish"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Gradle Properties File
        uses: kurt-code/gha-properties@v0.0.1
        id: read-properties
        with:
          operation: 'read'
          file-path: 'gradle.properties'
          keys: 'java.version,minecraft.version'

      - name: Extract patch version
        id: extract-patch
        uses: Communi-Suggestu/Cadens@0.0.2
        with:
          file: gradle.properties
          prefix: 'minecraft.version='

      - name: Extract major and minor version
        id: extract-major-minor
        uses: Communi-Suggestu/Spoliatus@0.1.0
        with:
          version: ${{ steps.read-properties.outputs['minecraft.version'] }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.read-properties.outputs['java.version'] }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - id: tagLocalBuild
        name: "🏷️ Tag local build"
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github@chisels-and-bits.com"
          git tag -f -a "${{ steps.extract-major-minor.outputs.joined }}.${{ steps.extract-patch.outputs.count }}" -m "${{ steps.extract-major-minor.outputs.joined }}.${{ steps.extract-patch.outputs.count }}"

      - id: getPreviousTag
        name: "📝 Get previous tag"
        run: |
          previous_tag=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1))
          echo "Previous tag: ${previous_tag}"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - id: generateReleaseChangelog
        name: "📝 Generate release changelog"
        run: |
          echo "# Changelog" > changelog.md
          echo "" >> changelog.md
          echo "[Full Changelog](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.getPreviousTag.outputs.previous_tag }}..${{ needs.compute-version.outputs.tag_version }})" >> changelog.md
          echo "" >> changelog.md
          echo "Changelog of version: ${{ steps.extract-major-minor.outputs.joined }}.${{ steps.extract-patch.outputs.count }}"
          echo "### Commits:" >> changelog.md
          echo "" >> changelog.md
          echo "$(git log --pretty=format:"- %s ([commit](${{ github.server_url }}/${{ github.repository }}/commit/%H))" ${{ steps.getPreviousTag.outputs.previous_tag }}..${{ needs.compute-version.outputs.tag_version }})" >> changelog.md
          echo "" >> changelog.md
          sed -i -E "s|\(#([[:digit:]]+)\)|([#\1](${{ github.server_url }}/${{ github.repository }}/pull/\1))|" changelog.md

      - name: Publish to Maven
        run: ./gradlew publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
          VERSION: ${{ steps.extract-major-minor.outputs.joined }}.${{ steps.extract-patch.outputs.count }}

      - id: publishLocalBuildTag
        name: "🏷️ Tag local build"
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github@chisels-and-bits.com"
          git push --tags


  texture-export:
    name: "Export textures to Assets"
    needs:
      - publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ChiselsAndBits

      - name: Read Gradle Properties File
        uses: kurt-code/gha-properties@v0.0.1
        id: read-properties
        with:
          operation: 'read'
          file-path: 'ChiselsAndBits/gradle.properties'
          keys: 'java.version,minecraft.version'

      - name: Extract patch version
        id: extract-patch
        uses: Communi-Suggestu/Cadens@0.0.3
        with:
          working-directory: 'ChiselsAndBits'
          file: 'gradle.properties'
          prefix: 'minecraft.version='

      - name: Extract major and minor version
        id: extract-major-minor
        uses: Communi-Suggestu/Spoliatus@0.0.2
        with:
          version: ${{ steps.read-properties.outputs['minecraft.version'] }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.read-properties.outputs['java.version'] }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install software OpenGL rendering
        run: sudo apt-get install xvfb libgl1-mesa-dri

      - name: Run texture export
        run: |
          cd ChiselsAndBits
          xvfb-run ./gradlew :neoforge:runExportTextures :neoforge:runExportMetadata

      - name: Checkout Assets Repo
        uses: actions/checkout@v6
        with:
          repository: ChiselsAndBits/Assets
          path: Assets
          token: ${{ secrets.ASSETS_PUSH_TOKEN }}

      - name: Copy exported textures and metadata to Assets repo
        run: |
          mkdir -p Assets/Icons/InGame
          mkdir -p Assets/Metadata/Tags
          cp -r ChiselsAndBits/neoforge/runs/exporters/texture/wiki_exporter/render/* Assets/Icons/InGame/
          cp -r ChiselsAndBits/neoforge/runs/exporters/metadata/wiki_exporter/tags/* Assets/Icons/Tags

      - name: Set up git config for Assets repo
        working-directory: Assets
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github@chisels-and-bits.com"

      - name: Commit and push changes to Assets repo
        working-directory: Assets
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            COMMIT_MSG=$(git --git-dir=${{ github.workspace }}/ChiselsAndBits/.git --work-tree=${{ github.workspace }}/ChiselsAndBits log -1 --pretty=%B)
            git add Icons/InGame
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
