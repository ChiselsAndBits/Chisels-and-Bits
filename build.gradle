plugins {
    id 'com.ldtteam.tableau.common' version '0.0.107'
}

tableau {
    project {
        group = "mod.chiselsandbits"
        publisher = "chisels-and-bits"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
}

allprojects { Project project ->
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(project.getProperties().get("java.version")))
        }
    }

    checkstyle {
        configFile = rootProject.file('common/codestyle/checkstyle.xml')
        toolVersion = '10.21.4'
    }

    tasks.register("checkstyle").configure {
        group "verification"
        description "Runs checkstyle over the test and main source set"

        dependsOn tasks.named("checkstyleMain")
        dependsOn tasks.named("checkstyleTest")
    }

    tasks.withType(Checkstyle).configureEach {
        group "verification"
    }

    tasks.withType(Javadoc.class).configureEach {
        // Keep missing-comment diagnostics enabled for the public API, but not implementation/docs modules.
        if (project.name in ['core', 'neoforge', 'fabric', 'wiki']) {
            options.addBooleanOption('Xdoclint:-missing', true)
        }
        options.addStringOption('Xmaxerrs', '10000')
        options.addStringOption('Xmaxwarns', '10000')
    }
}
