plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.80'
}

project.getRepositories().exclusiveContent(exclusiveContentRepository -> {
    exclusiveContentRepository.forRepositories(
            project.getRepositories().maven(repository -> {
                repository.setName("Sinytra - Wiki Exporter");
                repository.setUrl("https://maven.sinytra.org");
            })
    )
    exclusiveContentRepository.filter(filter-> {
        filter.includeModule("org.sinytra", "wiki-exporter-neoforge");
    })
})

platform {
    project {
        library()
        accessTransformers.from(rootProject.files('common/accesstransformer.cfg'))
    }
}

tableau {
    project {
        group = "mod.chiselsandbits"
        publisher = "chisels-and-bits"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('chisels-and-bits-chisels-and-bits')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}

dependencies {
    implementation "org.sinytra:wiki-exporter-neoforge:2.2.1+1.21.11"
}

jar {
    manifest {
        attributes(
                'FMLModType': 'GAMELIBRARY'
        )
    }
}