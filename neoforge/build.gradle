plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.80'
    id 'com.ldtteam.tableau.curseforge' version '0.0.80'
    id 'com.communi-suggestu.obumbratio' version '0.0.14'
    id 'com.communi-suggestu.bonorum' version '0.0.2'
}

repositories {
    maven {
        name = "Maven for PR #2815" // https://github.com/neoforged/NeoForge/pull/2815
        url = uri("https://prmaven.neoforged.net/NeoForge/pr2815")
        content {
            includeModule("net.neoforged", "neoforge")
            includeModule("net.neoforged", "testframework")
        }
    }
}

platform {
    neoforge {
        accessTransformers.from(rootProject.files("common/accesstransformer.cfg"))
    }
}

tableau {
    project {
        modId = "chiselsandbits"
        group = "mod.chiselsandbits"
        publisher = "chisels-and-bits"
        minecraftVersion = rootProject.property('minecraft.version')
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('chisels-and-bits-chisels-and-bits')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
    curse {
        id = Integer.parseInt(rootProject.property('curse.id.neoforge'))
    }
}

dependencies {
    includedLibraries "com.communi-suggestu.scena:neoforge:${project.property('communi.suggestu.scena.version')}"
}

bonorum {
    sinytraExporterVersion = '2.2.1+1.21.11'
    configFile = rootProject.file('website/exporter/config.json')
}

