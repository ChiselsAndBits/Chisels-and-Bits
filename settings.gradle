pluginManagement {
    repositories {
        mavenLocal()
        maven {
            url 'https://ldtteam.jfrog.io/artifactory/communi-suggestu-maven'
            name 'Communi-Suggestu Maven'
        }
        maven {
            url 'https://ldtteam.jfrog.io/artifactory/tableau'
            name 'Tableau Maven'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/'
        }
        maven {
            name = "Communi-Suggestu"
            url = "https://registry.communi-suggestu.com"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
    id 'com.communi-suggestu.placitum' version '0.0.88'
    id 'com.communi.suggestu.formatum.adhibe' version '0.3.77'
}

rootProject.name = "chisels-and-bits"

platforms {
    common(':api')
    core(':core')
    modernFabric(':fabric')
    devOnlyPlugin(':wiki')
    neoforge(':neoforge')

    defaults {
        java {
            version = 25
        }
        project {
            owner = "chisels-and-bits"
        }
    }
}

gradle.beforeProject { Project target ->
    target.apply(Map.of("from", target.rootProject.file("common/conventions/chiselsandbits.settings.codestyle-conventions.gradle")))
}