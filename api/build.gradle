plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.85'
    id 'com.communi-suggestu.javamark' version '0.0.25'
}

platform {
    project {
        library()
        accessTransformers.from(rootProject.files('common/accesstransformer.cfg'))
    }
}

tableau {
    project {
        group = "mod.chiselsandbits"
        publisher = "chisels-and-bits"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('chisels-and-bits-chisels-and-bits')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}

dependencies {
    api "com.communi-suggestu.scena:core:${project.property('communi.suggestu.scena.version')}"
}

tasks.withType(Javadoc.class).configureEach { Javadoc javadoc ->
    javadoc.options.tags = ["implNote:a:Note on the Implementation"]
    // Missing-javadoc doclint is enforced as a hard error for this library only;
    // implementation and documentation modules mute it in the root build file.
    javadoc.options.addBooleanOption('Xdoclint:missing', true)
    javadoc.options.addBooleanOption('Werror', true)
}

java {
    withJavadocJar()
}