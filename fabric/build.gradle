plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.80'
    id 'com.ldtteam.tableau.curseforge' version '0.0.80'
    id 'com.communi-suggestu.obumbratio' version '0.0.14'
}

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
}

platform {
    fabric {
        loaderVersion = rootProject.property('fabric.loader.version')
        apiVersion = rootProject.property('fabric.api.version')
        accessWideners = rootProject.file("common/accesswidener.accesswidener")
    }
}

tableau {
    project {
        modId = "chiselsandbits"
        group = "mod.chiselsandbits"
        publisher = "chisels-and-bits"
        minecraftVersion = rootProject.property('minecraft.version')
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('chisels-and-bits-chisels-and-bits')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
    curse {
        id = Integer.parseInt(rootProject.property('curse.id.fabric'))
    }
    sourceSets {
        main {
            isSourcesPublished = false
        }
    }
}

shaders {
    enable()
    sodium()
    fabric()
}

dependencies {
    modImplementation "com.communi-suggestu.scena:fabric:${project.property('communi.suggestu.scena.version')}"
    include "com.communi-suggestu.scena:fabric:${project.property('communi.suggestu.scena.version')}"
}